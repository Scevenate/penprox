name: pypi

on:
  push:
    tags: 
    - "v*"

jobs:
  build_wheels:
    name: Wheel@${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          # cibuildwheel archs=auto64
          - ubuntu-24.04      # manylinux x86_64
          - ubuntu-24.04-arm  # manylinux aarch64
          - windows-latest    # win amd64
          - windows-11-arm    # win arm64
          - macos-15-intel    # macosx x86_64
          - macos-15          # macosx arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Linux runs a container so rust is installed in pyproject [tool.cibuildwheel.linux].before-all.
        # As for macOS/Windows it's just on host machine.
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.runner }}
          path: ./wheelhouse/*.whl

  publish:
    needs: build_wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
