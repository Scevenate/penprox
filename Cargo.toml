[workspace]
resolver = "3"
members = ["src/penprox/_src", "src/penprox/_src/sdk", "src/penprox/_src/common"]

[workspace.dependencies]
async-trait = "0.1.92"
pyo3 = { version = "0.29.2", features = ["extension-module", "experimental-async"] }
tokio = { version = "1.53.1", features = ["sync", "rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
futures = "0.3.34"
moka = { version = "0.12.16", features = ["future"] }
simple-dns = "0.12.0"
