[package]
name = "penprox"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
readme = "README.md"
description = "Python proxy toolbox"
repository = "https://github.com/Scevenate/penprox"
keywords = ["proxy", "python", "network"]
categories = ["asynchronous", "network-programming"]

[lib]
name="penprox"
path = "src/penprox/_src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1.92"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py312", "experimental-async"] }
tokio = { version = "1.53.1", features = ["sync", "rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
futures = "0.3.34"
moka = { version = "0.12.16", features = ["future"] }
simple-dns = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.11"
