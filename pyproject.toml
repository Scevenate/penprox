[project]
name = "penprox"
version = "0.1.0"
authors = [
    { name = "Scevenate", email = "scevenate@gmail.com" }
]
description = "Python proxy toolbox"
readme = "README.md"
requires-python = ">=3.12"
license = "Unlicense"
license-files = ["LICENSES/*"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Rust",
    "Topic :: Internet"
]
dependencies = []

[build-system]
requires = [
   "build",
   "setuptools>=80",
   "setuptools-rust>=1.13.0",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "penprox",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools-rust.ext-modules]]
target = "penprox._src.penprox"
path = "src/penprox/_src/Cargo.toml"
binding = "PyO3"

[tool.cibuildwheel]
build = "cp312-*"
# 64-bit only; covers linux x86_64/aarch64, macOS x86_64/arm64, win amd64/arm64.
archs = "auto64"
skip = ["*-musllinux_*"]
test-command = "python -c \"import penprox\""

[tool.cibuildwheel.linux]
# Rust is not present in the manylinux/musllinux containers.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.uv.sources]
penprox = { workspace = true, editable = true }
