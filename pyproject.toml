[project]
name = "penprox"
version = "0.1.0"
description = "Proxy toolbox specialized for firewall penetration"
readme = "README.md"
requires-python = ">=3.12"
license = "Unlicense"
dependencies = []

[build-system]
requires = [
   "build",
   "setuptools>=80",
   "setuptools-rust>=1.13.0",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "penprox",
    "ruff>=0.16.5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools-rust.ext-modules]]
target = "penprox._src.penprox"
path = "src/penprox/_src/Cargo.toml"
binding = "PyO3"

[tool.uv.sources]
penprox = { workspace = true, editable = true }
